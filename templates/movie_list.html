<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <style>
        body {
            background-color: #131313;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #cc0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #cc0000;
            display: inline-block;
            padding-bottom: 10px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Responsive Grid Layout */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Movie Card Styling */
        .movie-card {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none; /* Remove underline from link */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Hover Effects */
        .movie-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #cc0000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.4);
        }

        /* Thumbnail Image */
        .movie-thumb {
            width: 100%;
            aspect-ratio: 2/3; /* Standard movie poster ratio */
            object-fit: cover;
            display: block;
        }

        /* Fallback for missing images */
        .movie-thumb:not([src]), .movie-thumb[src=""] {
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Movie Title */
        .movie-info {
            padding: 15px;
            text-align: center;
            background: linear-gradient(to top, #000 0%, #1a1a1a 100%);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-title {
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .movie-card:hover .movie-title {
            color: #cc0000;
        }

    </style>
</head>
<body>

    <h1>Select a Movie</h1>

    <div class="movie-grid">
        {% for movie in movies %}
        <a href="/movie/{{ movie.file_id }}" class="movie-card">
            
            <img src="{{ movie.thumb }}" alt="{{ movie.name }}" class="movie-thumb" loading="lazy">
            
            <div class="movie-info">
                <span class="movie-title">{{ movie.name }}</span>
            </div>
        </a>
        {% endfor %}
    </div>

</body>
</html>
