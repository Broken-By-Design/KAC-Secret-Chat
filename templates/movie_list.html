<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Movies</title> -->
    <style>
        body {
            background-color: #131313;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #cc0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 30px; /* Reduced slightly to fit search bar */
            border-bottom: 2px solid #cc0000;
            display: inline-block;
            padding-bottom: 10px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- SEARCH BAR STYLES --- */
        .search-container {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
        }

        #searchInput {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1.1rem;
            color: #fff;
            background-color: #000;
            border: 1px solid #333;
            border-radius: 30px;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: #cc0000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.3);
        }

        #searchInput::placeholder {
            color: #666;
        }
        /* ------------------------- */

        /* Responsive Grid Layout */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Movie Card Styling */
        .movie-card {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Hover Effects */
        .movie-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #cc0000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.4);
        }

        /* Thumbnail Image */
        .movie-thumb {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }

        /* Fallback for missing images */
        .movie-thumb:not([src]), .movie-thumb[src=""] {
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Movie Title */
        .movie-info {
            padding: 15px;
            text-align: center;
            background: linear-gradient(to top, #000 0%, #1a1a1a 100%);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-title {
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .movie-card:hover .movie-title {
            color: #cc0000;
        }
        
        /* Message when no results are found */
        #noResults {
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            display: none;
            grid-column: 1 / -1; /* Spans full width of grid */
        }

    </style>
</head>
<body>

    <h1>MVIES</h1>

    <!-- Search Input -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search...">
    </div>

    <div class="movie-grid" id="movieGrid">
        <!-- 'No Results' Message -->
        <div id="noResults">Nothing found matching your search.</div>

        {% for movie in movies %}
        <a href="/movie/{{ movie.file_id }}?n={{ movie.name }}" class="movie-card">
            <img src="{{ movie.thumb }}" alt="{{ movie.name }}" class="movie-thumb" loading="lazy">
            <div class="movie-info">
                <span class="movie-title">{{ movie.name }}</span>
            </div>
        </a>
        {% endfor %}
    </div>

    <!-- Filter Script -->
    <script>
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let query = this.value.toLowerCase();
            let cards = document.querySelectorAll('.movie-card');
            let hasResults = false;

            cards.forEach(card => {
                // Get the title text from the card
                let title = card.querySelector('.movie-title').textContent.toLowerCase();

                // Check if title contains the search query
                if (title.includes(query)) {
                    card.style.display = 'flex'; // Show card (flex because css uses display:flex)
                    hasResults = true;
                } else {
                    card.style.display = 'none'; // Hide card
                }
            });

            // Toggle 'No Results' message
            document.getElementById('noResults').style.display = hasResults ? 'none' : 'block';
        });
    </script>

</body>
</html>
