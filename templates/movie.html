<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://vjs.zencdn.net/8.23.4/video-js.min.css"
            rel="stylesheet"
        />
        <!-- <link href="https://cdn.jsdelivr.net/npm/@videojs/themes@1/dist/city/index.css" rel="stylesheet" /> -->
        <style>
            body {
                margin: 0;
                background: black;
            }
            .video-js {
                width: 100vw !important;
                height: 100vh !important;
            }
        </style>
        <title>{{ movie_name }}</title>
    </head>
    <body>
        <video
            id="my-video"
            class="video-js"
            controls
            preload="auto"
            width="100vw"
            height="100vh"
            type="video/mp4"
        >
            <source src="{{ movie_url }}" />
        </video>
        <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
        <script>
            const player = videojs("my-video", {
                playbackRates: [0.25, 0.5, 1, 1.25, 1.5, 2, 3],
            });

            const fid = "{{ fid }}";

            let retryCount = 0;
            const maxRetries = 3;

            let isPositionRestored = false;

            player.on("loadedmetadata", () => {
                const pos = localStorage.getItem(fid + "_pos");

                if (pos && parseFloat(pos) > 0) {
                    console.log("Restoring position to:", pos);
                    player.currentTime(parseFloat(pos));
                } else {
                    isPositionRestored = true;
                }
            });

            player.on("seeked", () => {
                isPositionRestored = true;
            });

            player.on("timeupdate", () => {
                if (isPositionRestored) {
                    localStorage.setItem(fid + "_pos", player.currentTime());
                }
            });

            player.on("error", function () {
                const error = player.error();
                const brokenTime = player.currentTime();

                console.log("Error detected:", error);

                if (retryCount < maxRetries) {
                    retryCount++;
                    console.log(
                        `Attempting to refresh URL (Attempt ${retryCount})...`
                    );

                    fetch(`/get_stream/${fid}`)
                        .then((response) => response.json())
                        .then((data) => {
                            if (data.url) {
                                console.log("New URL received:", data.url);

                                player.src({
                                    type: "video/mp4",
                                    src: data.url,
                                });
                                player.error(null);

                                player.one("loadedmetadata", function () {
                                    player.currentTime(brokenTime);
                                    player
                                        .play()
                                        .catch((e) =>
                                            console.log(
                                                "Auto-play prevented:",
                                                e
                                            )
                                        );
                                });
                            }
                        })
                        .catch((err) =>
                            console.error(
                                "Failed to fetch new stream URL:",
                                err
                            )
                        );
                } else {
                    console.error("Max retries reached. Stopping playback.");
                }
            });

            player.on("progress", () => {
                if (retryCount > 0) retryCount = 0;
            });

            document.addEventListener(
                "keydown",
                (event) => {
                    const key = event.key.toLowerCase();

                    // ESCAPE (Back)
                    if (key === "escape") {
                        event.preventDefault(); // Stop standard browser actions

                        if (player.isFullscreen()) {
                            player.exitFullscreen();
                        } else {
                            // Save Position
                            if (player.currentTime() > 0) {
                                localStorage.setItem(
                                    fid + "_pos",
                                    player.currentTime()
                                );
                            }
                            // Navigate Back
                            window.location.href = "/movies";
                        }
                    }

                    // SPACE BAR (Play/Pause)
                    else if (key === " ") {
                        event.preventDefault();
                        if (player.paused()) {
                            player.play();
                        } else {
                            player.pause();
                        }
                    }

                    // F KEY (Fullscreen)
                    else if (key === "f") {
                        if (player.isFullscreen()) {
                            player.exitFullscreen();
                        } else {
                            player.requestFullscreen();
                        }
                    }

                    // ARROW KEYS (Seek)
                    else if (event.key === "ArrowRight") {
                        player.currentTime(player.currentTime() + 10);
                    } else if (event.key === "ArrowLeft") {
                        player.currentTime(player.currentTime() - 10);
                    }
                },
                true
            );
        </script>
    </body>
</html>
