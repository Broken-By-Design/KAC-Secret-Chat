<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://vjs.zencdn.net/8.23.4/video-js.min.css"
            rel="stylesheet"
        />

        <style>
            body {
                margin: 0;
                padding: 0;
                background: black;
                /* This is the fix: */
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }
            .video-js {
                /* Use % so it fills the body exactly without triggering scrollbars */
                width: 100% !important;
                height: 100% !important;
                border: none; /* Just in case */
            }

            /* Optional: Make subtitles look a bit better/more readable */
            .video-js .vjs-text-track-display {
                bottom: 3em;
            }

            .vjs-audio-boost-button {
                cursor: pointer;
                font-weight: bold;
                font-size: 14px;
                width: 4em !important; /* Make it wider for text */
                color: #fff;
                margin-top: 0.2em;
            }
            .vjs-audio-boost-button:hover {
                text-shadow: 0 0 5px #fff;
                color: #ff4141; /* Netflix Red accent */
            }

            .vjs-title-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                padding: 20px;
                padding-top: 30px; /* Space from top */

                /* YouTube style dark gradient at the top so text is readable */
                background: linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.8) 0%,
                    rgba(0, 0, 0, 0) 100%
                );

                color: #fff;
                font-family: "Roboto", Arial, sans-serif;
                font-size: 1.5rem; /* Adjust size as needed */
                font-weight: 500;
                text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
                pointer-events: none; /* Let clicks pass through to the video */
                z-index: 10; /* Above the video, below the control bar */

                /* Animation settings */
                transition: opacity 0.5s ease;
                opacity: 1;
            }

            /* Hide the title when the controls are hidden (user inactive) AND video is playing */
            .video-js.vjs-user-inactive.vjs-playing .vjs-title-overlay {
                opacity: 0;
            }

            /* Ensure it stays visible if the video is paused, even if user is inactive */
            .video-js.vjs-paused .vjs-title-overlay {
                opacity: 1 !important;
            }
        </style>
        <!-- <title>{{ movie_name }}</title> -->
    </head>
    <body>
        <video
            id="my-video"
            class="video-js"
            controls
            preload="auto"
            type="video/mp4"
            crossorigin="anonymous"
            autofocus
        >
            <source src="{{ movie_url }}" />
            <!-- <track
                kind="captions"
                src="/get_subtitle/{{ fid }}"
                srclang="en"
                label="English"
            /> -->
        </video>
        <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
        <script src="https://cdn.sc.gl/videojs-hotkeys/latest/videojs.hotkeys.min.js"></script>
        <script>
            const player = videojs("my-video", {
                playbackRates: [0.25, 0.5, 1, 1.25, 1.5, 2, 3],
                enableSmoothSeeking: true,
                plugins: {
                    hotkeys: {
                        volumeStep: 0.1,
                        seekStep: 5,
                        enableModifiersForNumbers: true,
                        captureDocumentHotkeys: true,
                        documentHotkeysFocusElementFilter: (e) =>
                            e.tagName.toLowerCase() === "textarea" ||
                            e.tagName.toLowerCase() === "input",
                    },
                },
            });

            let audioCtx;
            let gainNode;
            let boostLevel = 1; 
            let boostButtonEl; // Holds the DOM element for the button

            function initAudioContext() {
                if (audioCtx) return; 

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                const videoElement = player.tech().el();

                try {
                    const source = audioCtx.createMediaElementSource(videoElement);
                    gainNode = audioCtx.createGain();
                    const compressor = audioCtx.createDynamicsCompressor();
                    
                    // Compressor settings to avoid distortion
                    compressor.threshold.setValueAtTime(-50, audioCtx.currentTime);
                    compressor.knee.setValueAtTime(40, audioCtx.currentTime);
                    compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
                    compressor.attack.setValueAtTime(0, audioCtx.currentTime);
                    compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

                    source.connect(gainNode);
                    gainNode.connect(compressor);
                    compressor.connect(audioCtx.destination);
                } catch (e) {
                    console.error("Audio Boost failed. CORS issue?", e);
                }
            }

            function toggleBoost() {
                if (!audioCtx) initAudioContext();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (!gainNode) return;

                // Cycle: 1 -> 2 -> 4 -> 1
                if (boostLevel === 1) boostLevel = 2;
                else if (boostLevel === 2) boostLevel = 4;
                else boostLevel = 1;

                gainNode.gain.value = boostLevel;

                // Update text
                if (boostButtonEl) {
                    boostButtonEl.innerHTML = `Vol: ${boostLevel}x`;
                    boostButtonEl.style.color = boostLevel > 1 ? "#ff4141" : "#fff";
                }
            }


            player.ready(function () {
                // this.focus();
                var myPlayer = this;

                const Button = videojs.getComponent('Button');

                class BoostBtn extends Button {
                    constructor(player, options) {
                        super(player, options);
                        this.addClass('vjs-audio-boost-button');
                        this.controlText('Audio Boost');
                        
                        // Save the element reference to the global variable
                        boostButtonEl = this.el();
                        boostButtonEl.innerHTML = 'Vol: 1x';
                    }

                    handleClick() {
                        toggleBoost();
                    }
                }

                // Register and Add Component
                videojs.registerComponent('BoostBtn', BoostBtn);
                myPlayer.controlBar.addChild('BoostBtn', {}, 8);



                setTimeout(function () {
                    myPlayer.focus();
                }, 200);

                const urlParams = new URLSearchParams(window.location.search);
                let movieName = urlParams.get("n") || "Unknown Title";

                const titleOverlay = document.createElement("div");
                titleOverlay.className = "vjs-title-overlay";

                titleOverlay.textContent = movieName;

                player.el().appendChild(titleOverlay);

                fetch(`/get_subtitles/${fid}`)
                    .then((response) => {
                        if (!response.ok) {
                            // If 404 or other error, throw to catch block (no subs)
                            throw new Error("Subtitle request failed");
                        }
                        return response.json();
                    })
                    .then((data) => {
                        // Expecting format: { subs: [ { label: "English 1", src: "..." }, ... ] }
                        if (data.subs && Array.isArray(data.subs)) {
                            console.log(
                                `Loaded ${data.subs.length} subtitle tracks.`
                            );

                            data.subs.forEach((sub, index) => {
                                // Add track to Video.js
                                myPlayer.addRemoteTextTrack(
                                    {
                                        kind: "captions", // 'captions' usually handles display better than 'subtitles' in some browsers
                                        label: sub.label,
                                        src: sub.src,
                                        srclang: "en",
                                        default: false, // Make no subtitles default
                                    },
                                    false
                                ); // false = don't clean up on source change (optional)
                            });
                        }
                    })
                    .catch((err) => {
                        console.log(
                            "No subtitles found or error fetching them:",
                            err
                        );
                    });
            });

            const fid = "{{ fid }}";

            let retryCount = 0;
            const maxRetries = 3;

            let isPositionRestored = false;

            player.on("loadedmetadata", () => {
                const pos = localStorage.getItem(fid + "_pos");

                if (pos && parseFloat(pos) > 0) {
                    console.log("Restoring position to:", pos);
                    player.currentTime(parseFloat(pos));
                } else {
                    isPositionRestored = true;
                }
            });

            player.on("seeked", () => {
                isPositionRestored = true;
            });

            player.on("timeupdate", () => {
                if (isPositionRestored) {
                    localStorage.setItem(fid + "_pos", player.currentTime());
                }
            });

            player.on("error", function () {
                const error = player.error();
                const brokenTime = player.currentTime();

                console.log("Error detected:", error);

                if (retryCount < maxRetries) {
                    retryCount++;
                    console.log(
                        `Attempting to refresh URL (Attempt ${retryCount})...`
                    );

                    fetch(`/get_stream/${fid}`)
                        .then((response) => response.json())
                        .then((data) => {
                            if (data.url) {
                                console.log("New URL received:", data.url);

                                player.src({
                                    type: "video/mp4",
                                    src: data.url,
                                });
                                player.error(null);

                                player.one("loadedmetadata", function () {
                                    player.currentTime(brokenTime);
                                    player
                                        .play()
                                        .catch((e) =>
                                            console.log(
                                                "Auto-play prevented:",
                                                e
                                            )
                                        );
                                });
                            }
                        })
                        .catch((err) =>
                            console.error(
                                "Failed to fetch new stream URL:",
                                err
                            )
                        );
                } else {
                    console.error("Max retries reached. Stopping playback.");
                }
            });

            player.on("progress", () => {
                if (retryCount > 0) retryCount = 0;
            });

            document.addEventListener(
                "keydown",
                (event) => {
                    const key = event.key.toLowerCase();

                    if (key === "escape") {
                        event.preventDefault();

                        if (player.isFullscreen()) {
                            player.exitFullscreen();
                        } else {
                            // Save Position
                            if (player.currentTime() > 0) {
                                localStorage.setItem(
                                    fid + "_pos",
                                    player.currentTime()
                                );
                            }
                            // Navigate Back
                            window.location.href = "/movies";
                        }
                    }
                },
                true
            );
        </script>
    </body>
</html>
