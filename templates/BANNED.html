<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banned</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: whitesmoke;
            background: #0c0c0c;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #151515;
            border-top: 2px solid #cc0000;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .title {
            color: #cc0000;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Access Denied</h1>
        <p class="subtitle">You have been banned from this chatroom.</p>
        <p id="message"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const messageEl = document.getElementById('message');
            const expiry = "{{ expiry }}";

            if (expiry && expiry.toUpperCase() !== 'NONE' && expiry.toUpperCase() !== 'NULL') {
                const date = new Date(expiry + ' UTC');
                if (!isNaN(date.getTime())) {
                    messageEl.textContent = `Your ban will be lifted on ${date.toLocaleString()} UTC.`;
                } else {
                    messageEl.textContent = 'This is a permanent ban.';
                }
            } else {
                messageEl.textContent = 'This is a permanent ban.';
            }
        });
    </script>
</body>
</html>
