<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banned</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: whitesmoke;
            background: #0c0c0c;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #151515;
            border-top: 2px solid #cc0000;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
        }

        .title {
            color: #cc0000;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .expiry-info {
            font-size: 1.1rem;
            background: #222;
            padding: 1rem;
            border-radius: 0.25rem;
            margin-top: 1.5rem;
            border-left: 3px solid #cc0000;
        }

        .expiry-info strong {
            color: #ff9999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Access Denied</h1>
        <p class="subtitle">Your IP address has been banned from the service.</p>
        <div class="expiry-info">
            {% if expiry == "Permanent" %}
                <p>This is a <strong>permanent</strong> ban.</p>
            {% else %}
                <p>Your ban will be lifted on:<br><strong>{{ expiry }}</strong></p>
            {% endif %}
        </div>
    </div>

</body>
</html>
